    idCell.innerHTML = idText;
    nameCell.innerHTML = nameText;

    if(filter === ""){
      row.style.display = "";
      return;
    }

    const found =
      idText.toLowerCase().includes(filter) ||
      nameText.toLowerCase().includes(filter);

    if(found){

      row.style.display = "";

      const regex = new RegExp(
        filter.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'),
        "gi"
      );

      idCell.innerHTML = idText.replace(regex,
        m => `<span class="highlight">${m}</span>`
      );

      nameCell.innerHTML = nameText.replace(regex,
        m => `<span class="highlight">${m}</span>`
      );

    }else{

      row.style.display = "none";

    }

  });

}
async function getBestCameraId(){

  const cams = await Html5Qrcode.getCameras();

  if(!cams.length){
    throw new Error("No camera found");
  }

  let selected = cams[0].id;

  for(const cam of cams){
    const name = (cam.label || "").toLowerCase();

    if(name.includes("back") || name.includes("rear")){
      return cam.id; // 📱 mobile back camera
    }

    if(name.includes("usb") || name.includes("webcam")){
      selected = cam.id;
    }
  }

  return selected;
}

async function startScan(){
  try{

    const cameraId = await getBestCameraId();

    if(cameraRunning){
      await safeStop();
    }

    scanned = false;
    cameraRunning = true;

    showScanLine();

    // 🔥 ដាក់ទីនេះ (UNLOCK SOUND)
    scanSound.play().then(()=>{
      scanSound.pause();
      scanSound.currentTime = 0;
    });

    await qr.start(
      cameraId,
      { fps: 10, qrbox: 250 },
      async (decodedText)=>{

        // 🔊 sound ពេល scan ជោគជ័យ
        scanSound.currentTime = 0;
        scanSound.play().catch(()=>{});

        navigator.vibrate?.(150);

        document.getElementById("result").innerText = decodedText;

        if(scanned) return;
        scanned = true;

        await safeStop();
        hideScanLine();
        openModal(decodedText);

      },
      (err)=>{}
    );

  }catch(e){
    hideScanLine();
    alert("Camera Error: " + e.message);
  }
}
async function safeStop(){
  try{
    if(cameraRunning){
      await qr.stop();
    }
  }catch(e){
    console.log("stop error:", e);
  }
  cameraRunning = false;
}

}else{

async function loadQR(){

  try{

    const qrSnap = await db.collection("qrData").get();
    const paySnap = await db.collection("qr_payments").get();

    qrList = [];
    paidSet = new Set();

    // 🔹 QR DATA
    qrSnap.forEach(doc=>{

      const d = doc.data();

      qrList.push({
        id: (d.id || "").toString().trim(),
        name: (d.name || "").toString().trim()
      });

    });

    // 🔹 PAYMENT DATA
    paySnap.forEach(doc=>{

      const d = doc.data();

      const paidId = (d.guestId || "")
        .toString()
        .trim();

      if(paidId){
        paidSet.add(paidId);
      }

    });

    // 🔥 RENDER
    renderModal();

  }catch(err){

    console.log("LOAD ERROR:", err);

  }

}

// ===============================

function renderModal(){

  const box = document.getElementById("modalList");

  const search = document
    .getElementById("modalSearch")
    .value
    .toLowerCase()
    .trim();

  box.innerHTML = "";

  // 🔥 FILTER + REMOVE PAID
  const list = qrList

    .filter(item=>{

      const match =
        item.id.toLowerCase().includes(search) ||
        item.name.toLowerCase().includes(search);

      const unpaid =
        !paidSet.has(item.id);

      return match && unpaid;

    })

    // 🔥 SORT NAME
    .sort((a,b)=>
      a.name.localeCompare(b.name)
    );

  // ❌ EMPTY
  if(list.length === 0){

    box.innerHTML = `
      <div style="
        padding:40px 20px;
        text-align:center;
        color:#999;
      ">

        <div style="
          font-size:50px;
          margin-bottom:10px;

        <small>
          មិនមានទិន្នន័យ
        </small>

      </div>
    `;

    return;
  }

  // 🔥 RENDER ITEMS
  list.forEach(item=>{

    const div = document.createElement("div");

    div.className = "modal-item";

    // 🔥 SEARCH HIGHLIGHT
    let showName = item.name;
    let showId = item.id;

    if(search){

      const regex = new RegExp(
        `(${search})`,
        "gi"
      );

      showName = item.name.replace(
        regex,
        `<span style="
          background:yellow;
          color:black;
          padding:1px 4px;
          border-radius:4px;
        ">$1</span>`
      );

      showId = item.id.replace(
        regex,
        `<span style="
          background:yellow;
          color:black;
          padding:1px 4px;
          border-radius:4px;
        ">$1</span>`
      );

    }

    div.style.cssText = `
      padding:14px;
      border-bottom:1px solid #eee;
      cursor:pointer;
      transition:.2s;
      background:white;
    `;

    div.innerHTML = `

      <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
      ">

        <div>

          <div style="
            font-size:17px;
            font-weight:bold;
            color:#0d6efd;
          ">
            👤 ${showName}
          </div>

          <div style="
            margin-top:4px;
            color:#666;
            font-size:13px;
          ">
            ${showId}
          </div>

        </div>

        <div style="
          font-size:18px;
          color:#0d6efd;
        ">
          ➜
        </div>

      </div>

    `;

    // 🔥 HOVER
    div.onmouseenter = ()=>{

      div.style.background = "#f1f7ff";
      div.style.transform = "scale(1.01)";

    };

    div.onmouseleave = ()=>{

      div.style.background = "#fff";

    };

    // 🔥 CLICK SELECT
    div.onclick = ()=>{

      // 🔥 AUTO FILL
      document.getElementById("guestId").value =

/* AUTO GENERATE ID */
async function generateNextId(){

  const snap = await db.collection("qrData")
    .orderBy("created","desc")
    .limit(1)
    .get();

  let next = 1;

  if(!snap.empty){

    const last = snap.docs[0].data();

    const lastId = last.id || "ID0000";

    const num = parseInt(
      lastId.replace("ID","")
    );

    next = num + 1;
  }

  return "ID" + String(next).padStart(4,"0");
}
